  name: Manual Generate Android APK
  on:
    workflow_dispatch:
      inputs:
        buildVariant:
          type: choice
          description: 'Build Variant'
          required: true
          default: 'NormalOptimized'
          options:
          - NormalOptimized
          - NormalDebug
          - VROptimized
          - VRDebug
          - LegacyOptimized

  jobs:
    apk:
      name: Generate ${{ github.event.inputs.buildVariant }} APK
      runs-on: ubuntu-latest
      timeout-minutes: 60

      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
            submodules: recursive

        - name: Check Valid Version Tags
          id: valid-tags
          shell: bash
          run: |
            echo "count=$(git tag -l 'v[0-9]*' | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT

        - name: Fetch upstream tags
          if: steps.valid-tags.outputs.count == '0'
          run: |
            git remote add upstream https://github.com/hrydgard/ppsspp.git
            git fetch --deepen=15000 --no-recurse-submodules --tags --force upstream || exit 0

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '17'
            cache: 'gradle'

        - name: Set up Android SDK (manual, fixed)
          run: |
            # 1. Download & extract cmdline-tools FIRST
            mkdir -p ${ANDROID_SDK_ROOT}/cmdline-tools
            cd ${ANDROID_SDK_ROOT}/cmdline-tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip
            mv cmdline-tools latest
            rm cmdline-tools.zip

            # 2. Add to PATH
            export PATH=${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:$PATH

            # 3. Accept licenses
            yes | sdkmanager --licenses --sdk_root=${ANDROID_SDK_ROOT}

            # 4. Install required packages
            sdkmanager \
              "platforms;android-34" \
              "build-tools;34.0.0" \
              "ndk;25.2.9519653" \
              "cmake;3.22.1" \
              --sdk_root=${ANDROID_SDK_ROOT}

        - name: Test androidGitVersion
          run: |
            echo "count=${{steps.valid-tags.outputs.count}}"
            gradle --quiet androidGitVersion

        - name: Assemble APK
          run: |
            VARIANT="${{ github.event.inputs.buildVariant }}"
            TASK="assemble${VARIANT}Debug"
            echo "Building task: $TASK"
            ./gradlew $TASK --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

        - name: Package build
          run: |
            find . -name "*.apk"
            mkdir -p ppsspp
            find android/build/outputs/apk -name "*.apk" -exec cp {} ppsspp/ \;

        - name: Upload artifact
          uses: actions/upload-artifact@v4
          with:
            name: android-${{ github.event.inputs.buildVariant }} build
            path: ppsspp/
            retention-days: 7

